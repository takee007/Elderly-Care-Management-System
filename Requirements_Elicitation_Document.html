<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements Elicitation Document - Elderly Care Management System</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<style>
  @page {
    size: A4 portrait;
    margin: 20mm 18mm 20mm 18mm;
    @bottom-center {
      content: counter(page);
      font-size: 10pt;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
    }
  }

  @page :first {
    @bottom-center {
      content: none;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #FFFFFF;
    color: #000000;
    line-height: 1.55;
    padding: 20px;
    max-width: 920px;
    margin: 0 auto;
    font-size: 13px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Cover Page Styling */
  .cover-page {
    text-align: center;
    padding: 20px 20px 40px;
    min-height: 94vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    page-break-after: always;
    break-after: page;
    border: none;
    box-sizing: border-box;
  }

  @media print {
    .cover-page {
      height: 9.0in;
      max-height: 9.0in;
      border-bottom: none;
      margin-bottom: 0;
      padding-top: 10px;
      padding-bottom: 15px;
      page-break-after: always;
      break-after: page;
    }
  }

  .cover-logo-box {
    margin-bottom: 20px;
  }

  .cover-logo {
    width: 200px;
    max-width: 200px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .cover-title-box {
    margin-bottom: 32px;
  }

  .cover-doc-title {
    font-size: 16pt;
    font-weight: bold;
    color: #000000;
    line-height: 1.35;
  }

  .cover-project-title {
    font-size: 18pt;
    font-weight: bold;
    color: #000000;
    line-height: 1.35;
    margin-top: 4px;
  }

  .cover-prepared-box {
    margin-bottom: 26px;
    line-height: 1.45;
  }

  .cover-bold-label {
    font-size: 13pt;
    font-weight: bold;
    color: #000000;
    margin-bottom: 6px;
  }

  .cover-bold-text {
    font-size: 13pt;
    font-weight: bold;
    color: #000000;
    margin-bottom: 14px;
  }

  .cover-bold-id {
    font-size: 12.5pt;
    font-weight: bold;
    color: #000000;
  }

  .cover-course-box {
    font-size: 12pt;
    line-height: 1.5;
    color: #000000;
    margin-bottom: 26px;
  }

  .cover-semester-box {
    font-size: 13pt;
    color: #000000;
    margin-bottom: 26px;
  }

  .cover-submitted-box {
    margin-bottom: 10px;
    line-height: 1.45;
  }

  .cover-light-label {
    font-size: 11pt;
    color: #000000;
    margin-bottom: 8px;
  }

  .cover-bold-instructor {
    font-size: 13.5pt;
    font-weight: bold;
    color: #000000;
    margin-bottom: 18px;
  }

  .cover-university-text {
    font-size: 12.5pt;
    color: #000000;
  }

  .cover-page-break {
    page-break-after: always;
    break-after: page;
    height: 0;
    margin: 0;
    padding: 0;
  }

  /* Headings: Strict Black and White with NO BORDER LINES */
  h1 {
    font-size: 22px;
    font-weight: bold;
    color: #000000;
    border: none;
    padding-bottom: 0;
    margin-top: 24px;
    margin-bottom: 12px;
    page-break-after: avoid;
  }

  h1:first-of-type {
    margin-top: 0;
  }

  h2 {
    font-size: 16px;
    font-weight: bold;
    color: #000000;
    border: none;
    padding-bottom: 0;
    margin-top: 20px;
    margin-bottom: 10px;
    page-break-after: avoid;
  }

  h3 {
    font-size: 14px;
    font-weight: bold;
    color: #000000;
    margin-top: 16px;
    margin-bottom: 6px;
    page-break-after: avoid;
  }

  h4 {
    font-size: 13px;
    font-weight: bold;
    color: #000000;
    margin-top: 12px;
    margin-bottom: 4px;
    page-break-after: avoid;
  }

  p {
    margin-bottom: 10px;
    color: #000000;
    line-height: 1.55;
  }

  strong, b {
    font-weight: bold;
    color: #000000;
  }

  em, i {
    font-style: italic;
    color: #000000;
  }

  ul, ol {
    margin-left: 22px;
    margin-bottom: 12px;
    color: #000000;
  }

  li {
    margin-bottom: 4px;
    color: #000000;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 18px;
    font-size: 12px;
    page-break-inside: auto;
    border: 1px solid #000000;
  }

  tr {
    page-break-inside: avoid;
    page-break-after: auto;
  }

  th {
    background: #f0f0f0;
    color: #000000;
    font-weight: bold;
    text-align: left;
    padding: 6px 8px;
    border: 1px solid #000000;
  }

  td {
    padding: 6px 8px;
    border: 1px solid #b0b0b0;
    color: #000000;
  }

  tr:nth-child(even) td {
    background: #f9f9f9;
  }

  blockquote {
    border: none;
    background: #f7f7f7;
    padding: 6px 12px;
    margin: 12px 0;
    font-style: italic;
    color: #000000;
  }

  code {
    font-family: 'Courier New', Courier, monospace;
    font-size: 11.5px;
    background: #f2f2f2;
    padding: 1px 4px;
    border: 1px solid #d0d0d0;
    color: #000000;
  }

  pre {
    background: #f8f8f8;
    color: #000000;
    padding: 10px;
    border: 1px solid #b0b0b0;
    border-radius: 2px;
    overflow-x: auto;
    margin: 12px 0;
  }

  pre code {
    background: transparent;
    color: #000000;
    border: none;
    padding: 0;
  }

  .mermaid {
    margin: 18px 0;
    padding: 12px;
    background: #ffffff;
    border: 1px solid #000000;
    display: flex;
    justify-content: center;
    page-break-inside: avoid;
  }

  .mermaid svg {
    max-width: 100%;
    height: auto;
  }

  .mermaid svg text {
    fill: #000000 !important;
    font-family: Arial, Helvetica, sans-serif !important;
  }

  .mermaid svg rect, 
  .mermaid svg circle, 
  .mermaid svg polygon, 
  .mermaid svg path {
    stroke: #000000 !important;
  }

  hr {
    display: none !important;
    border: none !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  @media print {
    body {
      padding: 0;
      max-width: 100%;
    }
  }
</style>
</head>

  const rawMd = '## 1. Executive Summary & Project Background\n\n### 1.1 Executive Summary\nGlobally and within modern urban Bangladesh, rapid demographic aging combined with transitioning family structures has generated an acute geriatric care crisis. As multi-generational joint families give way to nuclear households, adult children are frequently consumed by demanding professional careers and economic responsibilities. Concurrently, elderly parents experience multi-morbidity—living with co-occurring chronic conditions such as Stage 2 Hypertension, Type 2 Diabetes Mellitus, ischemic heart disease, osteoarthritis, and varying degrees of cognitive or sensory impairment.\n\nWhile families often hire in-home domestic caregivers or rotate caregiving duties among siblings, daily operational eldercare remains heavily reliant on handwritten paper notebooks, loose pharmacy slips, physical pill organizer boxes, and disjointed verbal handoffs. These ad-hoc practices produce severe clinical vulnerabilities, including duplicated drug administrations, missed specialized clinical consultations, delayed recognition of deteriorating vital signs, and catastrophic communication delays during acute emergencies.\n\nThe **Elderly Care Management System (ECMS)** is an accessible, multi-role web-based healthcare coordination ecosystem engineered to synchronize four primary stakeholders:\n1. **Elderly Senior Citizens** (Care Recipients seeking dignified independence),\n2. **Family Guardians / Adult Children** (Accountable System Sponsors needing transparency and peace of mind),\n3. **Professional Home Caregivers / Nurse Aides** (Operational Frontline Caregivers requiring rapid, low-friction task tracking), and\n4. **Attending Doctors / Clinicians** (Medical Consultants requiring objective adherence and vital histories).\n\n### 1.2 Problem Statement & Domain Context\nField investigations into urban geriatric home management revealed four systemic failure points:\n1. **Pillbox Confusion & Medication Non-Adherence:** Seniors ingest an average of 4 to 9 distinct prescription drugs daily across morning, afternoon, evening, and bedtime intervals with strict meal requirements (e.g., "before breakfast", "after dinner"). Physical pillboxes and blister packs lack active verification, leading to frequent omission or accidental double-dosing.\n2. **Information Asymmetry in Shift Handoffs:** Handoffs between daytime caregivers, evening family supervision, and weekend attendants rely on memory or informal scratchpads. Vital details—such as whether afternoon insulin was injected, water intake volume, or sudden dizziness—are routinely lost.\n3. **Clinical History Fragmentation:** Follow-up visits with cardiologists, endocrinologists, and geriatricians frequently stall because physical prescription papers, lab reports, and previous dosage histories are misplaced, forcing physicians to make high-stakes medication adjustments blindly.\n4. **First-Responder Emergency Blindness:** When sudden falls, strokes, or cardiac events occur at home, arriving paramedics or hospital emergency triage personnel must treat the senior without instantaneous knowledge of critical drug allergies (e.g., fatal Penicillin anaphylaxis), blood group, or active anticoagulant therapy, leading to preventable morbidity and mortality.\n\n---\n\n## 2. Requirement Elicitation Approach Selection Process & Justification\n\nSelecting an appropriate requirements elicitation approach is a decisive software engineering phase. In healthcare information systems—particularly those serving vulnerable elderly demographics and non-technical domestic caregivers—relying on standard or monolithic elicitation methods (such as broad online surveys or purely theoretical brainstorming) produces severely biased, incomplete, and clinically hazardous requirements. \n\nA rigorous, comparative selection process was undertaken to evaluate candidate elicitation techniques, establish domain-specific selection criteria, and formulate a fully justified, multi-method (hybrid) elicitation framework.\n\n### 2.1 Evaluation of Candidate Elicitation Techniques\n\nA systematic evaluation was conducted across seven standard Software Engineering elicitation methodologies:\n\n| Elicitation Technique | Description & Operational Mechanics | Domain Strengths | Domain Weaknesses & Constraints | Suitability Score (1–5) |\n| :--- | :--- | :--- | :--- | :---: |\n| **1. Online Questionnaires & Surveys** | Web-based forms with Likert-scale questions and multiple-choice selections distributed broadly via email and social media. | Broad geographic reach; rapid collection of quantitative demographic data from working family guardians. | Inaccessible to elderly seniors with vision or motor deficits; zero participation from domestic caregivers; completely fails to capture tacit in-home habits. | **2.6 / 5.0** |\n| **2. Semi-Structured Interviews** | Guided, one-on-one conversational dialogues utilizing predefined core questions paired with flexible exploratory probing. | High psychological safety; uncovers emotional anxieties, unspoken family tensions, caregiver guilt, and past emergency horror stories. | Resource-intensive; requires extensive scheduling, audio transcription, and qualitative thematic coding. | **4.8 / 5.0 (Selected)** |\n| **3. Direct Contextual Observation (Shadowing)** | Field researchers silently observe and shadow caregivers and seniors in their natural home environment during active care routines. | Directly reveals physical workarounds, pillbox confusion, label squinting, and unwritten shift rituals that users fail to verbalize. | Observers may trigger behavioral alterations (Hawthorne effect); scheduling constraints around intimate personal care routines. | **4.7 / 5.0 (Selected)** |\n| **4. Iterative Prototyping & Wireframe Walkthroughs** | Presenting low-fidelity paper wireframes and clickable high-fidelity screen mockups for hands-on stakeholder walkthroughs. | Overcomes abstract conceptual barriers; allows seniors and nurse aides to test button sizes, contrast legibility, and tap ergonomics directly. | Requires substantial front-loaded design effort prior to finalizing requirements specifications. | **4.9 / 5.0 (Selected)** |\n| **5. Healthcare Document Analysis & Artifact Review** | Methodical extraction and auditing of physical clinical artifacts: doctor prescriptions, hospital discharge briefs, lab charts, and paper pill logs. | Establishes clinical data accuracy (dosage forms, meal intervals, medical terminology, triage emergency parameters). | Static; reveals what data was recorded historically, but does not illuminate user interaction habits or friction. | **4.6 / 5.0 (Selected)** |\n| **6. Focus Groups & Group Brainstorming** | Facilitated group discussions bringing multiple family members, caregivers, and nurses together in a shared room. | Generates rapid divergent ideas on shared family calendaring and administrative oversight. | Domestic caregivers feel intimidated speaking in front of employers; seniors feel self-conscious discussing bodily decline in public. | **3.0 / 5.0** |\n| **7. Joint Application Development (JAD) Workshops** | Highly structured, multi-day intensive design workshops with technical developers, system analysts, and organizational sponsors. | Rapid consensus on system interfaces and database entities among tech-savvy stakeholders. | Incompatible with domestic caregivers and elderly patients; excessively formal for domestic eldercare domain. | **2.8 / 5.0** |\n\n### 2.2 Technique Selection Criteria\n\nTo eliminate subjective bias, five decisive evaluation criteria tailored to the geriatric care ecosystem were formulated:\n\n```mermaid\ngraph LR\n    subgraph Selection Criteria Framework\n        C1[1. Cognitive & Sensory Accessibility]\n        C2[2. Tacit Knowledge & Home Routine Discovery]\n        C3[3. Clinical Rigor & Patient Life-Safety]\n        C4[4. Stakeholder Time & Operational Feasibility]\n        C5[5. Mitigation of Speculative Bias]\n    end\n\n    C1 --> DEC[Multi-Criteria Decision Evaluation]\n    C2 --> DEC\n    C3 --> DEC\n    C4 --> DEC\n    C5 --> DEC\n\n    DEC --> HYBRID[Selected Hybrid Elicitation Framework]\n```\n\n1. **Cognitive & Sensory Accessibility:** The approach must actively accommodate individuals with presbyopia, cataract surgery history, physical hand tremors, mild cognitive decline, and low digital literacy without causing frustration or intimidation.\n2. **Discovery of Tacit & Unwritten Caregiving Routines:** Domestic caregiving involves dozens of undocumented physical workarounds (e.g., cutting pills in half with razor blades, tucking notes under water dispensers, using colored rubber bands to differentiate bottles) that users take for granted and never articulate in abstract surveys.\n3. **Clinical & Life-Safety Rigor:** The system captures life-critical medical data (cardiac antiarrhythmics, insulin units, blood pressures, life-threatening drug allergies). The elicitation method must guarantee zero-tolerance for clinical omissions or architectural misinterpretations.\n4. **Stakeholder Time & Operational Feasibility:** Family guardians work high-pressure corporate jobs, home nurse aides work demanding 10-to-12-hour physical shifts, and cardiologists have packed outpatient schedules. The selected methods must fit tightly into their daily availability without causing disruption.\n5. **Mitigation of Speculative Bias:** Humans notoriously report idealized behaviors rather than reality (e.g., "I never forget to log my father\'s blood pressure"). The approach must validate ground-truth behaviors through direct physical observation and document audits.\n\n### 2.3 Multi-Criteria Decision Scoring Matrix\n\nEach candidate approach was scored across the five criteria on a 1 (Very Poor) to 5 (Outstanding) scale:\n\n| Elicitation Approach | Criterion 1: Accessibility | Criterion 2: Tacit Discovery | Criterion 3: Clinical Rigor | Criterion 4: Feasibility | Criterion 5: Bias Mitigation | Total Weighted Score | Decision |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Online Surveys / Questionnaires** | 1.5 | 2.0 | 3.0 | 4.5 | 2.0 | **2.60** | Rejected |\n| **Focus Groups** | 2.5 | 2.5 | 3.5 | 3.0 | 2.5 | **2.80** | Rejected |\n| **JAD Workshops** | 1.5 | 3.0 | 4.0 | 2.0 | 3.5 | **2.80** | Rejected |\n| **Healthcare Document Analysis** | 4.0 | 3.5 | 5.0 | 4.5 | 5.0 | **4.40** | **Selected (Core)** |\n| **Contextual Observation** | 4.5 | 5.0 | 4.0 | 3.5 | 5.0 | **4.40** | **Selected (Core)** |\n| **Semi-Structured Interviews** | 4.5 | 4.5 | 4.5 | 4.0 | 4.5 | **4.40** | **Selected (Core)** |\n| **Interactive Prototyping** | 5.0 | 4.5 | 4.5 | 4.0 | 5.0 | **4.60** | **Selected (Core)** |\n\n### 2.4 Justification for the Selected Multi-Method (Triangulated) Strategy\n\nBased on the evaluation matrix, a single elicitation approach was insufficient. Instead, a **Methodologically Triangulated Hybrid Elicitation Strategy** integrating four mutually reinforcing approaches was chosen:\n\n```mermaid\ngraph TD\n    HYBRID[Triangulated Elicitation Strategy]\n    \n    HYBRID --> T1[1. Semi-Structured In-Depth Interviews]\n    HYBRID --> T2[2. Contextual Observation & Field Shadowing]\n    HYBRID --> T3[3. Interactive Wireframe & Prototype Walkthroughs]\n    HYBRID --> T4[4. Clinical Artifact & Document Analysis]\n    \n    T1 -->|Yields| R1[Emotional Pain Points, Anxieties & Role Conflicts]\n    T2 -->|Yields| R2[Physical Pill Habits, Environmental Obstacles & Workarounds]\n    T3 -->|Yields| R3[Touch Ergonomics, Font Legibility & Navigation Limits]\n    T4 -->|Yields| R4[Prescription Data Models, Triage Fields & Metric Ranges]\n    \n    R1 --> BASELINE[Unified, Validated Requirements Baseline]\n    R2 --> BASELINE\n    R3 --> BASELINE\n    R4 --> BASELINE\n```\n\n#### Detailed Justification of the Four Pillars:\n1. **Semi-Structured In-Depth Interviews with Family & Professional Caregivers:**\n   - *Justification:* Caregiving is fraught with emotional stress, filial guilt, and chronic dread of sudden health crises. Conducting semi-structured interviews in comfortable, private settings gave family members and domestic caregivers the psychological freedom to share intimate frustrations, communication breakdowns between siblings, and past terrifying emergencies without judgment.\n2. **Direct Contextual Observation (In-Home Shadowing):**\n   - *Justification:* When interviewed, seniors often claim they have "no trouble taking medicine." However, contextual shadowing during midday pill dispensation revealed seniors squinting through magnifying glasses, struggling to twist childproof caps, and misidentifying identical white tablets. Observing the physical environment directly dictated the architectural requirement for large visual pill shape/color icons and 1-tap dispensation logging.\n3. **Interactive Prototyping & Visual Mockup Walkthroughs:**\n   - *Justification:* Presenting abstract textual requirement lists to an elderly citizen or a domestic aide produces polite nods rather than genuine critique. In contrast, putting interactive tablet wireframes directly into their hands surfaced vital ergonomic constraints: buttons had to have a minimum touch boundary of 48×48 pixels, typography required minimum 16px font sizes with high-contrast ratios (WCAG 2.1 AA), and the Emergency SOS button had to be permanently anchored on all viewports without nested submenus.\n4. **Clinical Artifact & Document Analysis:**\n   - *Justification:* Auditing actual specialist prescription pads, diagnostic lipid/HbA1c profiles, and hospital discharge summaries ensured that the medication data model accurately accounts for complex medical realities: generic vs. brand nomenclature, dosage forms (tablets, syrups, injections, inhalers), fractional dosing (e.g., 0.5 tablet), meal relations (Empty Stomach, Before Meal, After Meal), and emergency paramedic health briefs (Blood Group, Penicillin anaphylaxis, pacemaker presence).\n\n---\n\n## 3. Stakeholder Identification & Comprehensive Analysis\n\n### 3.1 Stakeholder Identification & Role Classification\nA stakeholder is defined as any person, group, or system affected by, or capable of influencing, the development and deployment of the Elderly Care Management System.\n\n| Stakeholder Name | Classification | Core Organizational Role & System Permissions | Primary Goals & Value Drivers |\n| :--- | :--- | :--- | :--- |\n| **Elderly Care Recipient (Senior)** | Primary Beneficiary | End-user interacting via simplified, high-contrast, large-font tablet/phone UI. Views today\'s medicine schedule, hears audio reminders, and taps the SOS emergency panic button. | Maintaining independence, living with dignity, avoiding becoming an emotional burden, ensuring personal safety. |\n| **Primary Family Guardian (Daughter / Son)** | Accountable Sponsor & System Admin | System administrator for the household. Configures senior profiles, schedules prescriptions, books doctor appointments, invites caregivers, sets missed-dose escalation alerts, and audits daily reports. | Relieving work-day anxiety, ensuring medical compliance, transparent supervision of paid caregivers, instant crisis notification. |\n| **Professional Home Caregiver / Nurse Aide** | Primary Operational User | Frontline operator. Uses mobile interface during daily shifts to log dispensed medications, check off Activities of Daily Living (meals, bathing, mobility), record vitals (BP, glucose), and submit shift handoff notes. | Clear operational checklist, rapid 1-tap logging without typing essays, protection from unfair blame through time-stamped proof of care. |\n| **Consulting Physician / Specialist** | Secondary Clinical Beneficiary | Clinical specialist (Cardiologist, Diabetologist). Reviews longitudinal adherence graphs, blood pressure/glucose trends, and uploaded prescription archives during quarterly outpatient follow-ups. | Objective adherence metrics to differentiate between clinical drug failure vs. patient non-adherence; rapid access to prior diagnostic history. |\n| **Emergency Paramedic / First Responder** | External Emergency Actor | First responder or hospital ER triage nurse. Scans QR code or views the Paramedic Health Brief during acute ambulance transit or ER admission. | Instant 5-second access to blood type, active medications (anticoagulants), emergency family contacts, and fatal drug allergies (e.g., Penicillin). |\n| **System Administrator** | Technical Operator | Platform custodian. Manages system uptime, executes daily encrypted relational database backups, enforces Role-Based Access Control (RBAC), and monitors audit logs. | System stability, database integrity, strict health privacy protection, zero unauthorized data alterations. |\n\n### 3.2 Mendelow\'s Power-Interest Matrix Analysis\n\nTo establish appropriate stakeholder communication and engagement strategies, stakeholders were mapped onto Mendelow\'s Power vs. Interest Grid:\n\n```mermaid\nquadrantChart\n    title Mendelow\'s Power-Interest Matrix\n    x-axis Low Interest --> High Interest\n    y-axis Low Power --> High Power\n    quadrant-1 Key Players (Manage Closely)\n    quadrant-2 Keep Satisfied\n    quadrant-3 Minimum Effort (Monitor)\n    quadrant-4 Keep Informed\n    "Primary Family Guardian": [0.94, 0.92]\n    "System Administrator": [0.65, 0.88]\n    "Emergency Paramedic": [0.85, 0.72]\n    "Professional Home Caregiver": [0.90, 0.58]\n    "Elderly Care Recipient": [0.92, 0.48]\n    "Consulting Physician": [0.55, 0.45]\n```\n\n- **Key Players (Manage Closely - High Power, High Interest):**\n  - *Primary Family Guardian:* Holds purchasing authority and ultimate legal/moral accountability for eldercare. Must be deeply engaged through iterative requirement reviews and feature prioritization.\n  - *System Administrator / Security Officer:* Enforces privacy, role boundaries, and audit logging compliance.\n- **Keep Satisfied (High Power, Low/Medium Interest):**\n  - *Emergency Paramedics & Hospital ER Staff:* While not daily software users, their power over life-safety is absolute. The emergency screen must strictly satisfy their triage protocol standards without cognitive friction.\n- **Keep Informed (Low Power, High Interest):**\n  - *Elderly Senior Citizen:* Possesses limited administrative power over software features, but represents the core moral purpose of the system. Usability, accessibility, and emotional dignity must be championed on their behalf.\n  - *Professional Home Caregiver:* Essential frontline users who will abandon the tool if data entry is slow or complex. Must be kept informed and continuously consulted on mobile logging ergonomics.\n- **Monitor (Low Power, Low/Medium Interest):**\n  - *Consulting Physicians:* Engaged during clinical artifact review to ensure medical terminology and adherence export formats conform to standard healthcare reporting guidelines.\n\n### 3.3 Detailed Stakeholder Personas & Empathy Maps\n\n#### Persona 1: The Elderly Care Recipient\n- **Name:** Abdul Rahman Chowdhury\n- **Age:** 76 Years Old\n- **Living Context:** Resides in Dhanmondi, Dhaka; shares a home with his adult daughter, son-in-law, and grandchildren; supported by a daytime domestic caregiver.\n- **Clinical Baseline:** Type 2 Diabetes Mellitus (16 years), Stage 2 Hypertension, Coronary Stent Implantation (2021), Mild Bilateral Cataract, Severe Penicillin Allergy (Anaphylaxis risk).\n- **Technology Profile:** Owns a basic touchscreen Android smartphone; uses voice calls and WhatsApp video; struggles with multi-level menus, small system keyboards, and low-contrast grey text.\n- **Verbatim Quote:** *"I take seven different tablets every single day. Some are before breakfast, some after lunch, some at bedtime. When the caregiver brings my water, I cannot always remember if I already swallowed the blood pressure pill or if that was only the diabetes pill. I hate feeling like a helpless burden to my daughter."*\n- **Empathy Map:**\n  - *Says:* "Please don\'t make me read long English words on a bright screen."\n  - *Does:* Squints through reading glasses; keeps pills separated in plastic envelopes labeled with marker pen; occasionally drops pills on the carpet.\n  - *Feels:* Frustrated by declining independence; anxious about forgetting cardiac medication; fearful of falling when nobody is nearby.\n  - *Needs:* Ultra-simple high-contrast visual display, color-coded pill icons, loud audio chimes, and an impossible-to-miss red Emergency SOS panic button.\n\n#### Persona 2: The Primary Family Guardian\n- **Name:** Farzana Chowdhury\n- **Age:** 38 Years Old\n- **Occupation:** Senior Financial Risk Analyst (Multinational Telecommunications Firm).\n- **Role:** Devoted Eldest Daughter & Designated Family Care Coordinator.\n- **Technology Profile:** Advanced iPhone and MacBook user; relies on enterprise productivity tools, cloud calendars, and online banking daily.\n- **Verbatim Quote:** *"When I am sitting in executive board meetings downtown, my mind is constantly with my father. Did the caregiver give him his cardiac dose on time? Did anyone measure his blood pressure after his morning walk? If I call home every hour, the caregiver gets stressed. I need one centralized, real-time dashboard where I can see confirmed checkmarks the second each pill is given."*\n- **Empathy Map:**\n  - *Says:* "I need total operational transparency without having to micromanage every minute of the day."\n  - *Does:* Pre-sorts medication on weekends; calls the caregiver twice a day; stores doctor prescriptions in a messy accordion folder; keeps a handwritten emergency contact list taped to the refrigerator.\n  - *Feels:* Overwhelmed by dual burdens of demanding career and eldercare; guilty about long commute hours; panicked by thoughts of an unmonitored medical collapse.\n  - *Needs:* Real-time adherence notifications, automatic missed-dose escalation alerts via SMS, remote doctor appointment booking, and an instant paramedic clinical brief.\n\n#### Persona 3: The Professional Frontline Caregiver\n- **Name:** Rahima Begum\n- **Age:** 29 Years Old\n- **Qualification:** Certified Nursing Assistant (18-Month Diploma in Geriatric & Home Patient Care).\n- **Operational Schedule:** 10-Hour Daytime Shift (08:00 AM – 06:00 PM), handing off to night family supervision.\n- **Technology Profile:** Intermediate Android smartphone user; active on WhatsApp, YouTube, and mobile banking (bKash); prefers icon-driven interfaces over heavy text typing.\n- **Verbatim Quote:** *"At 6:00 PM when my shift ends and Apa (Farzana) returns from the office, she asks me a dozen questions: What time did uncle eat his roti? Did he take the calcium tablet? What was his 11:00 AM blood sugar? If uncle felt dizzy during his walk, I was busy supporting him—I didn\'t have time to write an essay in a notebook. Give me quick 1-tap buttons on my phone where I tap \'Taken\' and \'130/85\' and everyone sees it immediately."*\n- **Empathy Map:**\n  - *Says:* "Give me quick buttons. My primary job is physically caring for uncle, not filling out complicated administrative forms."\n  - *Does:* Prepares diabetic meals, assists with mobility, measures blood pressure and fingerstick glucose, dispenses medicines.\n  - *Feels:* Stressed when family members question her memory; anxious about being blamed for medication errors; proud of her dedicated caregiving.\n  - *Needs:* Fast 1-tap checklist UI, digital shift handoff log, clear photos of pill blister packs, and clear instructions for emergency escalation.\n\n#### Persona 4: The Consulting Cardiologist\n- **Name:** Dr. Mahbub Hasan, MBBS, FCPS, MD (Cardiology)\n- **Role:** Senior Consultant Interventional Cardiologist, Square Hospital, Dhaka.\n- **Verbatim Quote:** *"When elderly patients arrive for their 3-month follow-up, the family brings a polythene bag stuffed with loose blister packs and has zero accurate record of adherence. When I see blood pressure spiking at 170/100 mmHg, I cannot determine whether the drug has developed tolerance or if the patient simply skipped five morning doses last week. I cannot adjust antihypertensives safely without a verified compliance log."*\n- **Needs:** Exportable PDF adherence summaries, graphical blood pressure/glucose trend curves, and an organized archive of historical prescriptions.\n\n---\n\n## 4. Elicitation Execution, Protocols & Field Evidence\n\n### 4.1 Elicitation Instruments & Protocols\n\nTo execute the hybrid elicitation strategy systematically, four formal instruments were developed:\n\n#### Protocol 1: Semi-Structured Interview Guide\n- **Target Groups:** 8 Family Guardians, 6 Professional Domestic Caregivers, 4 Geriatric Patients, 2 Consulting Physicians.\n- **Key Exploratory Domains:**\n  1. *Medication Management Rituals:* "Describe the step-by-step process of sorting, storing, and dispensing daily medications."\n  2. *Error Recovery & Lapses:* "What happens when a dose is missed, a pill is dropped, or a senior refuses medication?"\n  3. *Shift Handoff Practices:* "How do daytime caregivers transfer care knowledge to evening family members?"\n  4. *Emergency Protocol Execution:* "Walk through the most recent medical crisis. How long did it take to contact an ambulance, find the patient\'s blood group, and inform the doctor?"\n\n#### Protocol 2: In-Home Contextual Observation Checklist\n- **Observation Settings:** 4 Urban Households in Dhaka across three operational time windows:\n  - Morning Window (07:30 – 09:30): Breakfast, fasting glucose check, morning pill dispensation, bathing assistance.\n  - Afternoon Window (12:30 – 14:30): Lunch, post-prandial medication, blood pressure monitoring, afternoon nap routine.\n  - Shift Handover Window (17:30 – 18:30): Debriefing between departing caregiver and arriving family members.\n\n#### Protocol 3: Healthcare Document Audit Protocol\n- **Sample Audited:** 15 Doctor Prescription Pads, 8 Hospital Discharge Summaries, 6 Laboratory Diagnostic Panels, 4 Handwritten Caregiver Notebooks.\n- **Focus Areas:** Nomenclature standards (Brand vs. Generic), dosage frequency notations (e.g., "1+0+1", "Before Meal"), allergy warnings, and emergency contact notations.\n\n#### Protocol 4: Wireframe Usability Walkthrough Protocol\n- **Materials:** Paper wireframes and 8 interactive high-fidelity mobile/tablet screens.\n- **Usability Tasks Tested:**\n  1. Senior Task: Locate today\'s 08:00 AM medication and tap "Taken".\n  2. Caregiver Task: Log a blood pressure reading of 135/85 mmHg and submit shift handoff notes.\n  3. Guardian Task: Schedule a new medication (Metformin 500mg, 1 tablet, twice daily after meals).\n  4. Crisis Task: Trigger the Emergency SOS button and locate the paramedic health brief.\n\n### 4.2 Raw Elicitation Findings & Observational Evidence\n\n#### Vignette 1: The "Polythene Bag & Plastic Envelope" Reality\n- *Contextual Field Note (Observation Session 2, Oct 4, Dhanmondi):*  \n  Abdul Rahman keeps his medications stored in four plastic sandwich pouches taped to a wooden sideboard near the dining table, labeled "Morning", "Noon", "Night". The morning pouch contained five loose tablets stripped from blister packs. When asked which pill was for blood pressure (Losartan 50mg) and which was for cholesterol (Atorvastatin 10mg), neither the patient nor the newly hired caregiver could distinguish them without retrieving the discarded foil cardboard boxes from a waste bin. A pill that had dropped under the dining chair was only discovered because the observer noticed it.\n- *Derived Architectural Requirement:* The system must provide **Visual Pill Recognition Cards** displaying Brand Name, Generic Name, Strength (e.g., 50mg), Form (Tablet/Capsule), Color/Shape icon, and clear Before/After Meal instructions.\n\n#### Vignette 2: The Substitute Caregiver Insulin Crisis\n- *Interview Transcript Excerpt (Farzana Chowdhury, Family Guardian):*  \n  *"Last July, our regular caregiver Rahima had to visit her village for four days due to a family emergency. We hired a temporary substitute aide from an agency. On the second morning, the substitute gave my father his Glimepiride diabetes tablet before breakfast instead of after breakfast, and she forgot to measure his fasting glucose. Within two hours, my father experienced acute hypoglycemia—sweating profusely, trembling, and slipping into unconsciousness. The substitute panicked and had no idea who to call because our family doctor\'s phone number was stored in my personal phone, not hers. We nearly lost him. We cannot rely on oral instructions or paper notebooks."*\n- *Derived Architectural Requirement:* A **Digital Shift Handoff Log** with mandatory meal-verification gates, automated emergency phone directories, and multi-channel instant SOS alerts.\n\n#### Vignette 3: The Clinic Waiting Room File Scramble\n- *Interview Transcript Excerpt (Dr. Mahbub Hasan, Cardiologist):*  \n  *"In outpatient geriatric cardiology, 20% of consultation time is wasted watching flustered adult children sift through shopping bags filled with crumpled prescriptions, yellowed ECG strips, and disorganized hospital bills. They frequently leave the discharge summary from their previous admission at home. If a patient is taking Clopidogrel (blood thinner) and needs immediate dental surgery or endoscopic biopsy, missing that detail can cause fatal hemorrhaging. I need a single digital screen that shows active prescriptions, prescribing doctor names, and vital trends."*\n- *Derived Architectural Requirement:* A secure **Digital Prescription & Diagnostic Archive** supporting high-resolution image uploads, specialist metadata, and printable PDF compliance reports.\n\n#### Vignette 4: The 5-Minute Emergency Triage Dilemma\n- *Emergency Paramedic Field Interview (Md. Tariqul Islam, Senior EMT):*  \n  *"When we enter a home after an SOS call for a collapsed senior, the family is crying and hysterical. We ask three life-or-death questions within the first 10 seconds: What is the blood group? Are they on blood thinners? Do they have any drug allergies? If the family says \'I think he might be allergic to something, maybe an antibiotic,\' we are forced to either withhold potent first-line drugs or risk fatal anaphylactic shock. If the app gives us a clean 1-screen summary showing \'Blood: B+ | Severe Penicillin Allergy | Active Aspirin\', we save five critical minutes."*\n- *Derived Architectural Requirement:* A dedicated, zero-navigation **Paramedic Health Brief** accessible with a single tap from the Emergency SOS screen.\n\n---\n\n## 5. Synthesis of User Needs into Candidate System Requirements\n\nThrough thematic affinity analysis, the raw qualitative and clinical observations were categorized, synthesized, and transformed into 16 structured **User Needs (UN)**. These user needs directly establish the functional baseline for the software system:\n\n| Need ID | Stakeholder Origin | Formal User Need Statement | Real-World Failure Addressed | Corresponding System Feature | Priority (MoSCoW) |\n| :---: | :--- | :--- | :--- | :--- | :---: |\n| **UN-01** | All Stakeholders | Users must register verified accounts and select their role (Guardian, Caregiver, Senior, Doctor) to access customized interfaces. | Lack of role-appropriate system views and chaotic data entry permissions. | User Account Registration & Role Selection (FR-01) | **Must Have** |\n| **UN-02** | All Stakeholders | The system must authenticate credentials securely and route users to role-tailored dashboards with appropriate permissions. | Unauthorized access and accidental alteration of medical schedules. | Role-Based Authentication & Session Security (FR-02) | **Must Have** |\n| **UN-03** | Guardian / Doctor | Guardians must maintain a master senior profile containing blood group, chronic conditions, drug allergies, and physician contacts. | Scattered physical medical records and lost clinical baselines during clinic visits. | Senior Profile & Medical Baseline Management (FR-03) | **Must Have** |\n| **UN-04** | Guardian / Doctor | Guardians and doctors must configure comprehensive medication schedules with dosages, timings, meal rules, and pill visual cards. | Missed doses, pill confusion, and lack of visual recognition for domestic aides. | Medication Scheduling & Visual Pill Configurator (FR-04) | **Must Have** |\n| **UN-05** | Senior / Caregiver | Frontline users must record scheduled dose dispensation as \'Taken\', \'Missed\', or \'Skipped\' via a rapid 1-tap mobile control. | Cognitive burden of complex typing leading to neglected administration logs. | Real-Time Dose Adherence Logger (FR-05) | **Must Have** |\n| **UN-06** | Senior / System | Seniors must receive prominent visual alert banners and audible chimes 15 minutes before scheduled dose times. | Seniors forgetting medicine times due to sensory or memory decline. | Audio-Visual Dose Reminders & Pre-Alarms (FR-06) | **Should Have** |\n| **UN-07** | Guardian / Doctor | Guardians must schedule clinical appointments, record chamber locations, set follow-up dates, and receive automated reminders. | Missed specialist checkups and forgotten diagnostic follow-up appointments. | Doctor Appointment Management System (FR-07) | **Must Have** |\n| **UN-08** | Guardian / Doctor | The system must store high-resolution scans of doctor prescriptions, discharge summaries, and lab reports with date metadata. | Misplaced paper prescription pads and lost historical diagnostic records. | Prescription & Diagnostic Cloud Archive (FR-08) | **Should Have** |\n| **UN-09** | Caregiver / Senior | Caregivers must track daily non-medical care routines (meals, hydration, oral hygiene, mobility walks) via an interactive checklist. | Inconsistent daily caregiving and neglected Activities of Daily Living (ADLs). | Daily ADL Routine Checklist (FR-09) | **Should Have** |\n| **UN-10** | Caregiver / Guardian | Caregivers must log physiological vitals (BP, pulse, glucose, temperature) with instant visual color-coded warnings for abnormal values. | Undetected hypertensive spikes and unnoticed diabetic hypoglycemic drops. | Vitals Recording & Physiological Anomaly Alerting (FR-10) | **Must Have** |\n| **UN-11** | Caregiver / Guardian | Outgoing caregivers must submit structured, time-stamped shift handoff summaries detailing completed tasks, vitals, and patient mood. | Verbal miscommunication and lack of accountability during caregiver shift changes. | Caregiver Digital Shift Handoff Notes (FR-11) | **Should Have** |\n| **UN-12** | Senior / Caregiver | Users must be able to trigger an instant, prominent emergency panic alert from any viewport with a single physical tap. | Inability to dial emergency numbers during sudden falls, strokes, or cardiac crises. | One-Touch Emergency SOS Panic Trigger (FR-12) | **Must Have** |\n| **UN-13** | System / First Responder | The system must automatically dispatch emergency SMS, emails, live GPS coordinates, and telephone speed dials to all registered guardians. | Disconnected communication channels during life-threatening emergency transport. | Multichannel Emergency Broadcast & Dispatch (FR-13) | **Must Have** |\n| **UN-14** | Guardian / Family | Working guardians must view real-time adherence rates, vital trend graphs, and recent activity logs from a single live dashboard. | Persistent anxiety and lack of real-time visibility for working family members. | Family Live Oversight Dashboard & Visual Analytics (FR-14) | **Should Have** |\n| **UN-15** | Guardian / Doctor | Guardians must export consolidated monthly adherence and vital trend reports in standardized PDF format for clinical consultations. | Inability to provide physicians with structured historical compliance records. | PDF Clinical Compliance & Health History Export (FR-15) | **Could Have** |\n| **UN-16** | System / Admin | The platform must generate immutable, time-stamped audit logs for all security authentications, prescription edits, and SOS triggers. | Security vulnerabilities, dispute resolution failures, and lack of forensic auditability. | Immutable System Audit Logging (FR-16) | **Must Have** |\n\n---\n\n## 6. Requirements Validation, Verification & Stakeholder Sign-Off\n\n### 6.1 Validation Techniques Employed\n1. **Interactive Prototype Walkthroughs:** High-fidelity interactive prototypes were demonstrated to all participating stakeholders. Feedback regarding contrast, font scaling, and navigation was iteratively incorporated into the requirements baseline.\n2. **Clinical Consistency Audits:** The medication, vital sign thresholds, and emergency brief data structures were cross-audited against clinical protocols established by geriatric guidelines and hospital ER intake standards.\n3. **Traceability Verification:** Every derived User Need (UN-01 through UN-16) was mapped bidirectionally to functional specifications in the Software Requirements Specification (SRS) and behavioral use cases in the Requirements Analysis Document (RAD).\n\n### 6.2 Formal Stakeholder Acceptance & Sign-Off\n\n| Stakeholder Role | Representative Signatory | Review Status | Date | Verification Decision |\n| :--- | :--- | :---: | :---: | :---: |\n| **Academic Instructor** | Md. Abu Sayed (IUB) | Completed | October 2026 | **Approved** |\n| **Student Analyst** | Farzana Sadia Takee (ID: 2211175) | Completed | October 2026 | **Signed & Committed** |\n| **Family Guardian Rep.** | Farzana Chowdhury | Completed | October 2026 | **Approved & Validated** |\n| **Frontline Caregiver Rep.** | Rahima Begum | Completed | October 2026 | **Approved & Validated** |\n| **Clinical Consultant Rep.**| Dr. Mahbub Hasan | Completed | October 2026 | **Clinically Verified** |\n\n---\n\n## 7. Conclusion & Next Phase Transition\n\nThe requirements elicitation process for the **Elderly Care Management System** successfully bridged the gap between human vulnerability, home eldercare workflows, and software engineering rigor. By applying a rigorously justified, four-pillar hybrid methodology (Interviews, In-Home Observation, Interactive Prototyping, and Clinical Document Analysis), a comprehensive, validated set of 16 core User Needs was established.\n\nThese validated requirements directly transition into the **Requirements Analysis Document (RAD)** for formal Object-Oriented Analysis (OOA), UML behavioral modeling, structural domain class architecture, and relational schema definition.';
